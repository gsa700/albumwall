# AlbumWall kiosk settings. Installed to ~/.config/albumwall-kiosk/kiosk.conf and
# read (as shell) by albumwall-kiosk and albumwall-kiosk-mode. Output names are
# the compositor's: list them with `wlr-randr` from a desktop session.

# The screen the wall fills.
MAIN_OUTPUT=HDMI-A-1
# Its mode and scale. Leave MAIN_MODE empty to keep the screen's preferred mode.
MAIN_MODE=3840x2160@59.982Hz
MAIN_SCALE=2

# The front panel's screen, or empty for no front panel. A bar display is often a
# phone panel standing on its side: PANEL_TRANSFORM rotates it (0, 90, 180, 270).
PANEL_OUTPUT=HDMI-A-2
PANEL_TRANSFORM=90

# The touchscreen, pinned to MAIN_OUTPUT, by its name as `libinput list-devices` shows it.
# Empty if there is none. Without it a second screen can end up taking the touches.
TOUCH_DEVICE=""

# The session albumwall-kiosk-mode returns to with "off". rpd-labwc is Raspberry Pi
# OS's own desktop; `ls /usr/share/wayland-sessions` lists what this machine has.
DESKTOP_SESSION_NAME=rpd-labwc
