# AlbumWall for Apple silicon, built where it can actually run.
#
# Techbench can cross-publish osx-arm64 (it did, 2026-10-10), but it cannot run
# the result. GitHub's macOS runners are Apple silicon, so this builds the
# single file there, checks it is a Mach-O arm64 executable, starts it for ten
# seconds as a smoke test (Avalonia up, no crash at startup), and keeps the
# binary and its log as an artifact for a Mac to download. It is NOT a release
# (scripts/release.sh makes those, and not yet for macOS), but since
# libmpv-0.41.0-6 it carries the same engine one would: the osx-arm64 build
# from the libmpv-* release that scripts/LIBMPV_RELEASE names, checked against
# that release's SHA256SUMS. Homebrew is not used.
name: macOS build

on:
  push:
    branches: [master]
    paths: ["src/**", "scripts/LIBMPV_RELEASE", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15          # Apple silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Audio engine, the pinned libmpv-* release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < scripts/LIBMPV_RELEASE)
          mkdir -p eng native/osx-arm64
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D eng -p "$tag-osx-arm64.zip" -p SHA256SUMS
          (cd eng && grep " $tag-osx-arm64.zip\$" SHA256SUMS | shasum -a 256 -c -)
          unzip -q "eng/$tag-osx-arm64.zip" -d native/osx-arm64
          echo "$tag" > native/osx-arm64/libmpv-source.txt
          head -1 native/osx-arm64/libmpv-build-info.txt
          file native/osx-arm64/libmpv.2.dylib | grep -q "Mach-O 64-bit dynamically linked shared library arm64"

      - name: Engine plays, certificate checked (https, the count every platform gives)
        run: |
          # The app opens libmpv only when something plays, so the smoke test
          # below never touches it. This does: two https streams through the
          # fetched dylib, 538,382 samples on Linux, Windows and the Studio.
          u=https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg
          dotnet run tools/gapless-check.cs -- "$PWD/native/osx-arm64/libmpv.2.dylib" "$u" "$u" | tee engine.log
          grep -q "decoded 538382 samples from 2 of 2 tracks" engine.log

      - name: Publish osx-arm64 single file
        run: |
          dotnet publish src/AlbumWall.App -c Release -r osx-arm64 -o out -nologo -v quiet
          ls -la out
          file out/AlbumWall
          file out/AlbumWall | grep -q "Mach-O 64-bit executable arm64"
          test "$(stat -f %z out/AlbumWall)" -gt 50000000
          # The engine went in: a string only libmpv has (its astats filter's
          # description; the file name alone is also in AlbumWall's own code).
          grep -aq "Show time domain statistics about audio frames" out/AlbumWall

      - name: Smoke test, ten seconds alive
        run: |
          # The app has no headless mode; the runner has a window server, so it
          # opens its window. Alive after ten seconds = Avalonia and the natives
          # loaded. timeout's own exit code (124) is the pass.
          set +e
          perl -e 'alarm 10; exec @ARGV' ./out/AlbumWall > smoke.log 2>&1
          rc=$?
          set -e
          echo "exit code $rc (124 or 142 = killed by the timer = alive = pass)"
          cat smoke.log
          test "$rc" -eq 142 -o "$rc" -eq 124 -o "$rc" -eq 137

      - name: Package
        run: |
          cd out && zip -9 -q ../AlbumWall-osx-arm64.zip AlbumWall && cd ..
          shasum -a 256 AlbumWall-osx-arm64.zip | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: AlbumWall-osx-arm64
          path: |
            AlbumWall-osx-arm64.zip
            SHA256SUMS
            smoke.log
            engine.log
          retention-days: 30
